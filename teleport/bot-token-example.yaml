# Join token for one Kubernetes cluster's issuer DaemonSet, annotated. You do not
# need to edit this file: `scripts/make-token.sh <bot-name>` prints a complete
# token with the current cluster's signing keys filled in. One token per
# cluster; name the bot after the cluster so `user.bot_name` in templates and
# JWT claims says where a credential was minted.
#
# join_method: kubernetes attests each DaemonSet pod by its projected
# ServiceAccount token (audience = your Teleport cluster name). Nothing is stored
# on the node and no secret is distributed; a restarted pod re-joins by itself.
#
# static_jwks: the Auth Service verifies the token against the Kubernetes
# cluster's published signing keys. Use this when the Auth Service cannot reach
# your cluster's API (Teleport Cloud always). scripts/make-token.sh fills the
# keys in from your current kubectl context; scripts/jwks.sh --check <token>
# tells you when a cluster rebuild or key rotation has changed them.
#
# If your self-hosted Auth Service CAN reach the cluster API, use
# `type: in_cluster` instead and drop the static_jwks block.
#
#   scripts/make-token.sh k8s-prod | tctl create --force
#   tctl bots add k8s-prod --roles=workload-identity-issuer --token=k8s-prod-issuer
kind: token
version: v2
metadata:
  name: k8s-prod-issuer
spec:
  roles: [Bot]
  bot_name: k8s-prod
  join_method: kubernetes
  kubernetes:
    type: static_jwks
    static_jwks:
      jwks: |
        FILLED_IN_BY_scripts/make-token.sh
    allow:
      - service_account: "teleport-wi:tbot"
