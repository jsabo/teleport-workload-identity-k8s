# A pod that asks the Workload API who it is, prints the answer, and exits.
# Nothing here names an identity: the SPIFFE ID is computed by Teleport from the
# namespace this file is applied to and the ServiceAccount below.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: processor
---
apiVersion: v1
kind: Pod
metadata:
  name: whoami
spec:
  serviceAccountName: processor
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: whoami
      image: ghcr.io/spiffe/spire-agent:1.12.4
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
      command:
        - /opt/spire/bin/spire-agent
        - api
        - fetch
        - jwt
        - -audience
        - sts.amazonaws.com
        - -socketPath
        - /spiffe-workload-api/spiffe.sock
      volumeMounts:
        - name: spiffe-workload-api
          mountPath: /spiffe-workload-api
          readOnly: true
  volumes:
    # The Workload API socket, delivered by the SPIFFE CSI driver. No hostPath,
    # so this pod passes the Pod Security "restricted" profile.
    - name: spiffe-workload-api
      csi:
        driver: csi.spiffe.io
        readOnly: true
